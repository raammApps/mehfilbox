# Drive `/api/cron/notify` from GitHub rather than from Vercel (N-54).
#
# Vercel's Hobby plan allows two cron jobs at one run a day, and `reconcile` and `usage` hold both
# slots — a third entry fails the deploy outright. Daily is not a schedule for a delivery message.
# GitHub Actions is free and unmetered on public repositories, so this costs nothing while there
# are no customers. When the account moves to Vercel Pro, delete this file and put the entry back
# in `vercel.json`; the route itself does not change either way.
#
# Two things to know about GitHub's scheduler, both of which are fine for email and would not be
# for anything interactive:
#
#   - Runs are delayed under load, commonly 5–20 minutes, and a run can be dropped entirely.
#     `drain` sends whatever is queued, so a skipped run costs latency, never a message.
#   - **A public repository's schedules are disabled after 60 days with no commits.** GitHub emails
#     first. Re-enable from the Actions tab; the workflow is unchanged.
name: Drain the notification queue

on:
  schedule:
    # Drain every quarter hour; queue the day's warnings once, early, at 03:40 UTC — a little
    # after 09:00 in India, which is when a studio would want to read one (N-21).
    - cron: '*/15 * * * *'
    - cron: '40 3 * * *'
  workflow_dispatch:

# Queue rather than overlap. `drain` reads, sends, then marks, so two concurrent runs would both
# see the same queued rows and send twice; serialising here removes that for this scheduler. It
# does not make the endpoint safe against a second caller — that needs the `sending` status in
# N-54, which is why that item stays open.
concurrency:
  group: notify-drain
  cancel-in-progress: false

permissions: {}

jobs:
  drain:
    name: POST /api/cron/notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Queueing is separate from sending because they fail for different reasons: deciding what
      # is due reads the database, sending talks to a third party. It runs before the drain in the
      # same job so a day's warnings are queued and delivered in one pass, and it is safe on every
      # run — 0014's unique index means a replayed day queues nothing new.
      # Before the warnings, deliberately: a catalogue that fell into grace this morning should be
      # warned about grace, not about an expiry it has already passed.
      - name: Move catalogues down the lapse ladder
        if: github.event.schedule == '40 3 * * *' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET: ${{ vars.DRAIN_URL || 'https://mehfilbox.com' }}
        run: |
          set -uo pipefail
          [ -z "${CRON_SECRET}" ] && { echo "::notice::CRON_SECRET is not set — skipping."; exit 0; }

          code=$(curl -sS -m 60 -o lifecycle.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET}/api/cron/lifecycle") || { echo "::error::request failed"; exit 1; }

          echo "HTTP ${code}"
          cat lifecycle.json; echo
          echo "### Lifecycle $(jq -c . lifecycle.json 2>/dev/null || cat lifecycle.json)" >> "$GITHUB_STEP_SUMMARY"
          [ "${code}" = "200" ] || { echo "::error::unexpected ${code}"; exit 1; }

      - name: Queue any warnings due today
        if: github.event.schedule == '40 3 * * *' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET: ${{ vars.DRAIN_URL || 'https://mehfilbox.com' }}
        run: |
          set -uo pipefail
          [ -z "${CRON_SECRET}" ] && { echo "::notice::CRON_SECRET is not set — skipping."; exit 0; }

          code=$(curl -sS -m 60 -o warnings.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET}/api/cron/warnings") || { echo "::error::request failed"; exit 1; }

          echo "HTTP ${code}"
          cat warnings.json; echo
          echo "### Warnings $(jq -c . warnings.json 2>/dev/null || cat warnings.json)" >> "$GITHUB_STEP_SUMMARY"
          [ "${code}" = "200" ] || { echo "::error::unexpected ${code}"; exit 1; }

      - name: Drain
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET: ${{ vars.DRAIN_URL || 'https://mehfilbox.com' }}
        run: |
          set -uo pipefail

          # Skip rather than fail when the secret is absent. A fork, or this repository before the
          # secret is set, would otherwise show a red run every fifteen minutes forever — noise
          # that trains everyone to ignore the one failure that matters.
          if [ -z "${CRON_SECRET}" ]; then
            echo "::notice::CRON_SECRET is not set — skipping. Set it in Settings → Secrets → Actions."
            exit 0
          fi

          code=$(curl -sS -m 60 -o body.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET}/api/cron/notify") || { echo "::error::request failed"; exit 1; }

          echo "HTTP ${code}"
          cat body.json; echo

          # 401 is the interesting failure: the endpoint is up and the secret is wrong, which means
          # the queue silently stops draining. Say so rather than letting it read as a blip.
          if [ "${code}" = "401" ]; then
            echo "::error::401 — CRON_SECRET here does not match Vercel's. The queue is not draining."
            exit 1
          fi
          [ "${code}" = "200" ] || { echo "::error::unexpected ${code}"; exit 1; }

          echo "### Drain $(jq -c . body.json 2>/dev/null || cat body.json)" >> "$GITHUB_STEP_SUMMARY"
