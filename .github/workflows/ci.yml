name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs against the drivers that need no third-party account, which is what makes the
  # pipeline hermetic: no Supabase project, no Bunny key, no flake from someone else's uptime.
  DATA_DRIVER: memory
  VIDEO_DRIVER: fake
  ROOT_DOMAIN: mehfilbox.localhost:3000
  SESSION_SECRET: ci-session-secret-0123456789abcdefghijklmnopqrst

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test:ci

      # Names the failing assertion in the run summary, so a red build says what broke without
      # anyone opening the log.
      #
      # This was `dorny/test-reporter@v1`, which rejected `reporter: vitest-json` — not a value it
      # accepts. That is an *input* error, so `fail-on-error: false` did not soften it, and because
      # the step sits above them, knip, the contrast gate, the build, the bundle budget and the
      # vitals gate were skipped on every run for days. A decorative step was gating five real
      # ones. Reading `reports/vitest.json` here needs no third-party action and can be tested
      # before it ships.
      - name: Test report
        if: always()
        run: |
          [ -f reports/vitest.json ] || exit 0
          node -e "
            const r = require(process.cwd() + '/reports/vitest.json');
            const out = [];
            const fail = [];
            for (const f of r.testResults ?? [])
              for (const a of f.assertionResults ?? [])
                if (a.status === 'failed')
                  fail.push({ file: f.name.replace(process.cwd() + '/', ''), name: a.fullName, why: (a.failureMessages ?? [])[0] ?? '' });
            out.push(\`**\${r.numPassedTests}/\${r.numTotalTests} passed**, \${r.numFailedTests} failed, \${(r.testResults ?? []).length} files\`, '');
            if (fail.length) {
              out.push('| test | file |', '|---|---|');
              for (const f of fail.slice(0, 30)) out.push(\`| \${f.name} | \\\`\${f.file}\\\` |\`);
              out.push('');
              for (const f of fail.slice(0, 10)) out.push('\`\`\`', f.name, f.why.split('\n').slice(0, 6).join('\n'), '\`\`\`');
            }
            console.log(out.join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const row = (k) => \`| \${k} | \${c[k].pct}% | \${c[k].covered}/\${c[k].total} |\`;
              console.log('| | covered | |');
              console.log('|---|---|---|');
              ['statements','branches','functions','lines'].forEach(k => console.log(row(k)));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      # Code nothing imports, and dependencies nothing uses. Caught here so it never accumulates
      # — it already found an unused `framer-motion` and a photo cap that enforced nothing.
      - name: Dead code and unused dependencies
        run: pnpm check:dead

      - name: Palette contrast gate
        run: pnpm check:contrast

      - name: Build
        run: pnpm build

      # doc 05 §6: the browse page has 150KB gzip of first-load JS. It sat at 146KB with
      # nothing watching it, which is how a budget quietly stops being one.
      - name: First-load JS budget
        run: pnpm check:bundle

      - name: Install Chromium for the vitals gate
        run: pnpm exec playwright install --with-deps chromium

      # LCP and CLS on the page every guest lands on (doc 05 §1). Not Lighthouse: its simulated
      # throttling moves by hundreds of milliseconds between identical commits on shared runners,
      # which buys either a threshold that catches nothing or a red build that gets muted.
      - name: Core Web Vitals budget
        run: pnpm check:vitals

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      # Covers the six journeys in doc 10 §2, the OG size budget (doc 10 §1 test 11) and the
      # zero-axe-violations gate (doc 10 §4).
      - name: Run Playwright
        run: pnpm test:e2e
        env:
          # Playwright's own server needs a writable store per run; memory keeps runs isolated.
          DATA_DRIVER: memory

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
